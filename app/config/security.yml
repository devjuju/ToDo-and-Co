security:
  password_hashers:
    AppBundle\Entity\User:
      algorithm: auto

  providers:
    doctrine:
      entity:
        class: AppBundle\Entity\User
        property: username

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      pattern: ^/
      form_login:
        login_path: login
        check_path: login
        enable_csrf: true
        csrf_token_id: authenticate

      logout:
        path: logout
        target: /

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/users, roles: ROLE_ADMIN }
    - { path: ^/, roles: ROLE_USER }
