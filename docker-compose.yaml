services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: todo-and-co-php

    ports:
      - "8267:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:5.7
    platform: linux/amd64

    container_name: todo-and-co-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todolist

    ports:
      - "3309:3306"

    volumes:
      - todo_and_co_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin

    container_name: todo-and-co-phpmyadmin

    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8268:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  todo_and_co_mysql_data:
