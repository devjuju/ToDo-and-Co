services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: projet8-todolist-php

    ports:
      - "8167:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:5.7
    platform: linux/amd64

    container_name: projet8-todolist-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todolist

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin

    container_name: projet8-todolist-phpmyadmin

    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8168:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  mysql_data:
